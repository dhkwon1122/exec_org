# app 컨테이너 앞단 TLS 리버스 프록시 (Researcher-board deploy/nginx.conf 와 같은 구성).
# docker-compose.yml 의 reverse-proxy 서비스(--profile proxy)가 이 파일을 마운트한다.
# 인증서는 certs/server.crt·certs/server.key (scripts/gen_self_signed_cert.sh 로 만든 자체 서명
# 인증서, 또는 운영에서는 사내 PKI 발급 인증서로 같은 파일명 교체).
#
# X-Forwarded-For/-Proto 를 전달한다 — app.py 의 로그인 시도 제한이 실제 클라이언트 IP 를
# 구분하려면 .env 에 TRUSTED_PROXY_COUNT=1 과 짝을 맞춘다.
server {
    listen 80;
    server_name _;
    # 이 프록시를 쓸 때는 평문 HTTP 를 HTTPS 로만 리다이렉트한다.
    # 8443 은 docker-compose.yml 의 PROXY_HTTPS_PORT 기본값 — 바꿨다면 여기도 같이 바꾼다
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # app.py MAX_CONTENT_LENGTH(기본 80MiB — 참고자료 파일 업로드)보다 넉넉하게
    client_max_body_size 90m;

    location / {
        proxy_pass http://app:8502;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 정리 등 오래 걸리는 요청 대비 (gunicorn --timeout 과 맞춤)
        proxy_read_timeout 300s;
    }
}
